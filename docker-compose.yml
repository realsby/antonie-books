services:
  api:
    build: .
    # Same as in AWS: the app can not write files.
    read_only: true
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: books
      SEED_DATA: "true"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    # Only this computer can reach the database.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs the tests in Docker. Start it with: docker compose run --rm tests
  tests:
    image: ghcr.io/astral-sh/uv:0.12-python3.14-trixie-slim
    profiles: ["test"]
    working_dir: /code
    volumes:
      - .:/code
    environment:
      MONGO_URL: mongodb://mongo:27017
      # Keep the Linux venv out of the project folder.
      UV_PROJECT_ENVIRONMENT: /tmp/venv
      PYTHONDONTWRITEBYTECODE: "1"
    command: uv run --frozen pytest -v
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
